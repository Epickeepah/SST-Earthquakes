    <script>

        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1NjM2NDFlZS1jNjhkLTQyOGMtYjI5Ny00ZTY2Mjk2YTk1YjUiLCJpZCI6NDYzOTIyLCJzdWIiOiJlcGlja2VlcGFoIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IlNTVCBNYXBzIFdlYnNpdGUiLCJpYXQiOjE3ODU5MDQ3OTh9.ztQvfEjmKm1eyLFcD8iqnIc4ZK_HGH_n4HEuHWP99_M";

        const viewer = new Cesium.Viewer("cesiumContainer", {
            terrain: Cesium.Terrain.fromWorldTerrain(),

            animation: false,        // removes bottom left clock/play controls
            timeline: false,         // removes bottom timeline
            geocoder: true,         // removes search button
            homeButton: true,       // removes home button
            sceneModePicker: true,  // removes globe/2D button
            baseLayerPicker: true,  // removes imagery button
            navigationHelpButton: false // removes ? button
        });

        // Force camera to Earth
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
                0,
                0,
                20000000
            )
        });

        const now = new Date();

        // End date (today)
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, "0");
        let day = String(now.getDate()).padStart(2, "0");

        // Start date (default to today)
        let start_year = year;
        let start_month = month;
        let start_day = String(Number(day) - 1).padStart(2, "0");

        let minimumMagnitude = 2.5



        async function loadEarthquakes() {

            const loading = document.getElementById("loading-screen");
            loading.style.display = "flex";

            try {


                if (Number(day) === Number(start_day)) {
                    start_day = String(Number(start_day) - 1).padStart(2, "0");
                }

                viewer.entities.removeAll();

                console.log(
                    `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=${start_year}-${start_month}-${start_day}T00:00:00&endtime=${year}-${month}-${day}T23:59:59&minmagnitude=${minimumMagnitude}`
                );

                const response = await fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=${start_year}-${start_month}-${start_day}T00:00:00&endtime=${year}-${month}-${day}T23:59:59&minmagnitude=${minimumMagnitude}`)

                document.getElementById("current-date-bottom").textContent = `${start_year}-${start_month}-${start_day}`;
                document.getElementById("current-date-top").textContent = `${year}-${month}-${day}`;
                document.getElementById("version-text").textContent = `V-${WEB_VERSION}`
                document.getElementById("mag-text").textContent = `Minimum Mag-${minimumMagnitude}`


                const earthquakes = await response.json();

                let quakeCount = 0

                for (let i = 0; i < earthquakes.features.length; i++) {
                    quakeCount++;
                    document.getElementById("quake-count").textContent = `Quakes Loaded-${quakeCount}`

                    const quake = earthquakes.features[i];

                    let longitude = quake.geometry.coordinates[0];
                    let latitude = quake.geometry.coordinates[1];

                    let groundHeight = 0;

                    let dotSize = 10;
                    let dotColor = Cesium.Color.GREEN;
                    let titleColor = "green";


                    if (quake.properties.mag >= 6) {

                        let newDotSize = quake.properties.mag * 8
                        dotSize = newDotSize;
                        dotColor = Cesium.Color.RED;
                        titleColor = "red"

                    } else if (quake.properties.mag >= 4 && quake.properties.mag < 5.9) {
                        let newDotSize = quake.properties.mag * 6
                        dotSize = newDotSize;
                        dotColor = Cesium.Color.ORANGE;
                        titleColor = "orange"
                    }


                    viewer.entities.add({

                        position: Cesium.Cartesian3.fromDegrees(
                            longitude,
                            latitude,
                            groundHeight + 2000
                        ),

                        point: {
                            pixelSize: dotSize,
                            color: dotColor
                        },

                        description: `
        <div style="
            font-family: Arial;
            padding: 10px;
            width: 200px;
        ">

        <h2 style="margin:0; color:${titleColor};">
        🌎 Earthquake
        </h2>

        <hr>

        <b>Magnitude:</b> ${quake.properties.mag}<br>

        <b>Location:</b><br>
        ${quake.properties.place}<br><br>

        <b>Time:</b><br>
        ${new Date(quake.properties.time).toLocaleString()}

        <button onclick="showDetails('${quake.id}')"
        style="
        border-radius: 8px;
        margin-top: 10px;
        ">
            More Details
        </button>

        </div>
        `
                    });
                };
                document.getElementById("loading-screen").style.display = "none";
            } catch (error) {
                console.error("Earthquake loading failed:", error);

            } finally {
                loading.style.display = "none";
            }
        }

        let earthquakesLoaded = false;

        viewer.scene.globe.tileLoadProgressEvent.addEventListener(function (tilesLoading) {

            if (tilesLoading === 0 && !earthquakesLoaded) {

                earthquakesLoaded = true;
                loadEarthquakes();

            }

        });

        function submitDate() {
            let new_start_day = document.getElementById("day").value.padStart(2, "0");
            let new_start_month = document.getElementById("month").value.padStart(2, "0");
            let new_start_year = document.getElementById("year").value;

            let new_day = document.getElementById("end-day").value.padStart(2, "0");
            let new_month = document.getElementById("end-month").value.padStart(2, "0");
            let new_year = document.getElementById("end-year").value;


            const start = new Date(
                Number(new_start_year),
                Number(new_start_month) - 1,
                Number(new_start_day)
            );

            const end = new Date(
                Number(new_year),
                Number(new_month) - 1,
                Number(new_day)
            );


            if (start.getTime() > end.getTime()) {
                document.getElementById("loading-screen").style.display = "none";
                alert("Start date cannot be after end date.");
                return;
            }



            start_day = new_start_day;
            start_month = new_start_month;
            start_year = new_start_year;

            day = new_day;
            month = new_month;
            year = new_year;


            viewer.entities.removeAll();
            loadEarthquakes();

            closeCalendarMenu();
            quakeCount = 0
        }

        function submitMag() {
            const magSelect = document.getElementById("mag-select");

            minimumMagnitude = Number(magSelect.value);

            console.log("Minimum magnitude set to:", minimumMagnitude);

            closeSettingsMenu();
            quakeCount = 0
            loadEarthquakes();
        }

        window.onload = function () {

            const now = new Date();

            let currentYear = now.getFullYear();
            let currentMonth = now.getMonth() + 1;
            let currentDay = now.getDate();

            document.getElementById("end-day").value = currentDay;
            document.getElementById("end-month").value = currentMonth;
            document.getElementById("end-year").value = currentYear;

        };


    </script>
