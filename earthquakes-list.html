<!doctype html>

<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earthquake Details</title>

    <style>
      /* Top header */
      .top-frame {
        width: 100%;
        height: 100px;

        display: flex;
        align-items: center;

        position: relative;

        padding: 25px;

        box-sizing: border-box;

        background-color: #504f4f;
      }

      /* Logo */
      .Logo {
        position: relative;
        left: 0px;
        width: 70px;
        height: 70px;

        object-fit: contain;
      }

      /* SST MAPS name */
      .site-name {
        position: relative;
        margin-left: 15px;

        color: white;
      }

      .site-name h1 {
        position: relative;
        margin: 0;

        text-align: left;

        font-size: 30px;
      }

      .site-name p {
        position: relative;
        margin: 3px 0 0;

        color: #d0d0d0;

        font-size: 15px;
      }

      body {
        margin: 0;
        padding: 25px;
        background-color: #504f4f;
        font-family: Arial, sans-serif;
        color: #030303;
      }

      h1 {
        text-align: center;
      }

      #earthquake-list {
        width: min(900px, 100%);
        margin: 25px auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .earthquake {
        display: grid;
        grid-template-columns: 100px 1fr 180px;
        align-items: center;
        padding: 18px;
        background-color: white;
        border: 1px solid #d0d0d0;
        border-left: 8px solid #777;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .magnitude {
        font-size: 28px;
        font-weight: bold;
      }

      .location {
        font-size: 19px;
        font-weight: bold;
      }

      .details {
        margin-top: 6px;
        color: #666;
      }

      .depth-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .green-square-case {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
      }

      .intensity-group {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .intensity-group > p {
        margin: 0;
        margin-right: 5px;
      }

      .green-square-popup {
        width: 35px;
        height: 35px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0;
        padding: 0;

        border-radius: 4px;

        font-family: "Times New Roman", serif;
        font-size: 18px;
        font-weight: bold;

        color: black;
        flex-shrink: 0;
      }

      .green-square {
        width: 35px;
        height: 35px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 4px;

        font-family: "Times New Roman", serif;
        font-size: 20px;
        font-weight: bold;
        color: black;

        flex-shrink: 0;
      }

      .green-square-popup {
        width: 35px;
        height: 35px;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        margin: 0;
        padding: 0;

        border-radius: 4px;
        background-color: #7acb82;

        font-family: "Times New Roman", serif;
        font-size: 20px;
        font-weight: bold;
        color: black;

        flex-shrink: 0;
      }

      .time {
        text-align: right;
        color: #555;
      }

      @media (max-width: 650px) {
        .top-frame {
          height: 80px;
          padding: 20px;
        }

        .Logo {
          left: 20px;
          width: 55px;
          height: 55px;
          transform: translate(-35px, 30px);
        }

        .site-name {
          left: 5px;
          margin-left: 10px;
          transform: translate(-35px, 30px);
        }

        .site-name h1 {
          left: 5px;
          font-size: 22px;
        }

        .site-name p {
          left: 5px;
          font-size: 12px;
        }

        .Version {
          top: 8px;
          right: 12px;

          font-size: 11px;
        }

        body {
          padding: 12px;
        }

        .earthquake {
          grid-template-columns: 75px 1fr;
        }

        .magnitude {
          font-size: 23px;
        }

        .location {
          font-size: 16px;
        }

        .time {
          grid-column: 2;
          text-align: left;
          margin-top: 8px;
          font-size: 13px;
        }

        .map-button,
        .settings-button {
          width: 30px;
          height: 30px;
        }

        .version {
          font-size: 12px;
        }

        .more-details-popup {
          width: 95vw;
          height: auto;
          min-height: 0;
          padding: 0px;
          border-radius: 12px 12px 0 0;
        }
      }

      .map-button {
        width: 35px;
        height: 35px;

        border: none;
        border-radius: 4px;
        background: rgb(48, 51, 54);
        padding: 0;
        cursor: pointer;
        z-index: 1000;
      }

      .map-button img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .list-settings-popup {
        display: none;

        position: fixed;
        top: 0px;
        left: 50%;
        transform: translateX(-50%);

        width: 400px;
        height: 345px;

        padding: 30px;

        background: rgb(48, 51, 54);
        color: white;

        border: 2px solid #666;
        border-radius: 12px;

        z-index: 2000;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }

      .settings-button {
        width: 35px;
        height: 35px;

        border: none;
        background: transparent;
        border-radius: 4px;
        background: rgb(48, 51, 54);
        padding: 0;
        cursor: pointer;
        z-index: 1000;
      }

      .settings-button img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 28px;
        transform: translateY(-20px);
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;

        background-color: #777;
        border-radius: 28px;

        transition: 0.3s;
      }

      .slider:before {
        content: "";

        position: absolute;
        height: 22px;
        width: 22px;

        left: 3px;
        bottom: 3px;

        background-color: white;
        border-radius: 50%;

        transition: 0.3s;
      }

      input:checked + .slider {
        background-color: #2196f3;
      }

      input:checked + .slider::before {
        transform: translateX(25px);
      }

      .settings-options {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .switch-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-text {
        margin: 0;
        font-size: 14px;
        transform: translateY(-20px);
      }

      .today {
        color: white;
      }

      .top-controls {
        position: absolute;
        top: 8px;
        left: 10px;
        right: 10px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        z-index: 1000;
      }

      .left-buttons {
        display: flex;
        gap: 10px;
      }

      .version {
        color: white;
        font-size: 14px;
        margin: 0;
      }

      main {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }

      .button-group {
        position: absolute;

        bottom: 20px;
        width: 85%;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      .button-group button {
        height: 30px;
        width: 150px;
        padding: 0 25px;
        font-size: 16px;
      }

      .divider {
        font-size: 25px;
        color: white;
      }

      .location {
        font-size: 19px;
        font-weight: bold;
        color: black;
        cursor: pointer;
      }

      .location:hover {
        color: blue;
      }

      .earthquake-links {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .quake-badge {
        width: 60px;
        height: 42px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-decoration: none;
        color: black;

        border-radius: 2px;
        font-family: Arial, sans-serif;
      }

      .roman {
        font-size: 13px;
        font-weight: bold;
        line-height: 14px;
      }

      .badge-title {
        font-size: 11px;
        line-height: 12px;
      }

      .dyfi {
        background-color: #7acb82;
      }

      .shakemap {
        background-color: #ffff00;
      }

      .more-details-popup {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translate(-50%, 100%);

        width: 400px;
        max-width: 90vw;
        height: auto;
        min-height: 350px;

        padding: 20px;

        background: rgb(48, 51, 54);
        color: white;

        border: 2px solid #666;
        border-radius: 12px;

        z-index: 2000;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;

        opacity: 0;
        transition:
          transform 0.35s ease,
          opacity 0.35s ease;

        pointer-events: none;
      }

      .more-details-popup.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }

      .quake-badges {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
      }

      .quake-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 6px 12px;

        border-radius: 8px;

        text-decoration: none;
        font-size: 14px;
        transform: translateY(-20px);
      }
      #dyfi-section {
        display: none;
      }

      #dyfi-section {
        display: none;
      }

      #dyfi-section,
      #shakemap-container {
        padding: 3px;
        margin-bottom: 30px;
      }
    </style>
  </head>

      <div class="top-controls">
        <div class="left-buttons">
          <a href="index.html" class="map-button">

        </div>

      <div id="list-settings-popup" class="list-settings-popup">
        <h1 class="select-date">Settings</h1>

        <br />
        <div class="settings-options">

        <div class="button-group">

          <span class="divider">|</span>

    <header class="top-frame">
      <img src="images/logo.PNG" alt="SST Maps Logo" class="Logo" />

      <div class="site-name">

    <script src="script.js"></script>
    <script src="config.js"></script>

    <script>
      document.getElementById("version-text").textContent = `V-${WEB_VERSION}`;
      function submitMag() {
        const quakeToggle = document.getElementById("magnitude-toggle");
        const dateToggle = document.getElementById("date-change");
        const kmChange = document.getElementById("km-change");
        const latLongChangeToggle = document.getElementById("lat-long-change");

        if (quakeToggle.checked) {
          minimumMagnitude = 1;
        } else {
          minimumMagnitude = 2.5;
        }

        if (dateToggle.checked) {
          // Past 30 days
          end = new Date();

          start = new Date();
          start.setDate(start.getDate() - 30);
          console.log("test");
        } else {
          // Back to past 24 hours
          end = new Date();

          start = new Date(end.getTime() - 24 * 60 * 60 * 1000);

          console.log("test");
        }

        if (kmChange.checked) {
          useKilometers = true;
        } else {
          useKilometers = false;
        }

        if (latLongChangeToggle.checked) {
          showLatLong = false;
        } else {
          showLatLong = true;
        }

        closeListSettingMenu();
        loadEarthquakes();
      }
    </script>

    <h1 class="today">Earthquakes Today</h1>

    <div id="earthquake-list">Loading earthquakes...</div>

    <script>
      const now = new Date();

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      let end = new Date();
      let start = new Date(end.getTime() - 24 * 60 * 60 * 1000);
      let minimumMagnitude = 2.5;
      let showLatLong = true;
      let useKilometers = false;
      let selectedQuake = null;

      function getIntensityColor(mmi) {
        if (mmi < 2) {
          return "#8c8c8c"; // I
        } else if (mmi < 4) {
          return "#a6cee3"; // II-III
        } else if (mmi < 5) {
          return "#00ffff"; // IV
        } else if (mmi < 6) {
          return "#00ff00"; // V
        } else if (mmi < 7) {
          return "#ccff00"; // VI
        } else if (mmi < 8) {
          return "#ffff00"; // VII
        } else if (mmi < 9) {
          return "#ff9900"; // VIII
        } else if (mmi < 10) {
          return "#ff0000"; // IX
        } else {
          return "#cc0000"; // X+
        }
      }

      async function getEarthquakeProducts(quake) {
        try {
          const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/detail/${quake.id}.geojson`;

          const response = await fetch(url);

          if (!response.ok) {
            return {
              dyfi: null,
              shakemap: null,
            };
          }

          const data = await response.json();

          const dyfiProduct = data.properties?.products?.dyfi?.[0];

          const shakeMapProduct = data.properties?.products?.shakemap?.[0];

          let dyfi = null;
          let shakemap = null;

          // ==========================================
          // DYFI
          // ==========================================

          if (dyfiProduct) {
            const geoJsonFile = dyfiProduct.contents?.["dyfi_geo_1km.geojson"];

            if (geoJsonFile?.url) {
              const dyfiResponse = await fetch(geoJsonFile.url);

              if (dyfiResponse.ok) {
                const dyfiGeoJson = await dyfiResponse.json();

                let maxMMI = null;

                for (const feature of dyfiGeoJson.features || []) {
                  const properties = feature.properties || {};

                  const possibleMMI = Number(
                    properties.cdi ?? properties.mmi ?? properties.MMI,
                  );

                  if (!isNaN(possibleMMI)) {
                    if (maxMMI === null || possibleMMI > maxMMI) {
                      maxMMI = possibleMMI;
                    }
                  }
                }

                if (maxMMI !== null) {
                  dyfi = {
                    mmi: maxMMI,
                    color: getIntensityColor(maxMMI),
                    reports: Number(dyfiProduct.properties?.numResp ?? 0),
                    product: dyfiProduct,
                    geojson: dyfiGeoJson,
                  };
                }
              }
            }
          }

          // ==========================================
          // SHAKE MAP
          // ==========================================

          if (shakeMapProduct) {
            console.log("ShakeMap found:", quake.id);

            const contents = shakeMapProduct.contents || {};

            console.log("ShakeMap contents:", contents);

            // --------------------------------------
            // Find grid.xml
            // --------------------------------------

            let gridFile = null;

            for (const [key, value] of Object.entries(contents)) {
              if (key.toLowerCase().includes("grid.xml") && value?.url) {
                gridFile = value;
                break;
              }
            }

            // --------------------------------------
            // Read grid.xml
            // --------------------------------------

            if (gridFile?.url) {
              console.log("ShakeMap grid found:", gridFile.url);

              try {
                const gridResponse = await fetch(gridFile.url);

                if (gridResponse.ok) {
                  const xmlText = await gridResponse.text();

                  const parser = new DOMParser();

                  const xml = parser.parseFromString(
                    xmlText,
                    "application/xml",
                  );

                  // Find the MMI field
                  const fields = Array.from(xml.querySelectorAll("grid_field"));

                  const mmiField = fields.find((field) => {
                    const name = field.getAttribute("name");

                    return name && name.toLowerCase() === "mmi";
                  });

                  if (mmiField) {
                    const mmiIndex = Number(mmiField.getAttribute("index"));

                    console.log("ShakeMap MMI field index:", mmiIndex);

                    const gridData = xml.querySelector("grid_data");

                    if (gridData) {
                      const lines = gridData.textContent.trim().split(/\r?\n/);

                      let maxMMI = null;

                      for (const line of lines) {
                        const values = line.trim().split(/\s+/);

                        if (values.length >= mmiIndex) {
                          const mmi = Number(values[mmiIndex - 1]);

                          if (!isNaN(mmi)) {
                            if (maxMMI === null || mmi > maxMMI) {
                              maxMMI = mmi;
                            }
                          }
                        }
                      }

                      if (maxMMI !== null) {
                        console.log("ShakeMap maximum MMI:", maxMMI);

                        shakemap = {
                          mmi: maxMMI,
                          color: getIntensityColor(maxMMI),
                          product: shakeMapProduct,
                          contents: contents,
                        };
                      }
                    }
                  } else {
                    console.warn(
                      "ShakeMap grid.xml does not contain an MMI field:",
                      quake.id,
                    );
                  }
                }
              } catch (error) {
                console.warn("Could not read ShakeMap grid.xml:", error);
              }
            } else {
              console.warn(
                "ShakeMap found, but no grid.xml was found:",
                quake.id,
              );
            }
          }

          return {
            dyfi: dyfi,
            shakemap: shakemap,
          };
        } catch (error) {
          console.warn(`Earthquake products failed for ${quake.id}`, error);

          return {
            dyfi: null,
            shakemap: null,
          };
        }
      }

      function dyfiMarks(count) {
        count = Math.round(count);

        if (count >= 10) {
          return "X+";
        }

        const roman = [
          { value: 9, symbol: "IX" },
          { value: 5, symbol: "V" },
          { value: 4, symbol: "IV" },
          { value: 1, symbol: "I" },
        ];

        let result = "";

        for (const item of roman) {
          while (count >= item.value) {
            result += item.symbol;
            count -= item.value;
          }
        }

        return result;
      }

      async function loadEarthquakes() {
        const earthquakeList = document.getElementById("earthquake-list");

        try {
          const response = await fetch(
            `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson` +
              `&starttime=${start.toISOString()}` +
              `&endtime=${end.toISOString()}` +
              `&minmagnitude=${minimumMagnitude}` +
              `&orderby=time` +
              `&limit=20000`,
          );

          const earthquakes = await response.json();
          console.log(earthquakes.features[0]);

          earthquakeList.innerHTML = "";

          if (earthquakes.features.length === 0) {
            earthquakeList.innerHTML = `
                    <p>No magnitude 2.0 or larger earthquakes were found today.</p>
                `;
            return;
          }

          for (let i = 0; i < earthquakes.features.length; i++) {
            const quake = earthquakes.features[i];

            const products = await getEarthquakeProducts(quake);

            const dyfiData = products?.dyfi || null;
            const shakemapData = products?.shakemap || null;

            const hasDYFI = dyfiData !== null;
            const hasShakeMap = shakemapData !== null;

            const dyfiColor = dyfiData?.color || "transparent";

            const longitude = quake.geometry.coordinates[0];
            const latitude = quake.geometry.coordinates[1];
            let depth = quake.geometry.coordinates[2];

            if (!useKilometers) {
              depth = depth * 0.621371;
            }

            const magnitude = quake.properties.mag;
            const location = quake.properties.place;
            const time = new Date(quake.properties.time);

            const earthquakeBox = document.createElement("div");

            earthquakeBox.className = "earthquake";

            earthquakeBox.onclick = () => {
              console.log("CLICKED", quake);

              selectedQuake = quake;

              openListDetailsMenu(quake);
            };

            let titleColor = "green";

            if (quake.properties.mag >= 6) {
              titleColor = "red";
            } else if (
              quake.properties.mag >= 4 &&
              quake.properties.mag < 5.9
            ) {
              titleColor = "orange";
            }

            earthquakeBox.className = "earthquake";

            earthquakeBox.innerHTML = `
    <div class="magnitude" style="margin:0; color:${titleColor};">
        M ${magnitude.toFixed(1)}
    </div>

    <div>
        <div class="location">
            ${location}, ID: ${quake.id}
        </div>

<div class="details">


    <div class="depth-row">

        Depth: ${depth.toFixed(2)}
        ${useKilometers ? "km" : "miles"},

        ${
          hasDYFI
            ? `
            <span>DYFI:</span>

            <div
                class="green-square"
                style="background-color: ${dyfiColor}"
            >
                ${dyfiMarks(dyfiData.mmi)}
            </div>
            `
            : ""
        }

       ${
         hasShakeMap
           ? `
        <span>ShakeMap:</span>

        <div
            class="green-square"
            style="background-color: ${shakemapData.color}"
        >
            ${dyfiMarks(shakemapData.mmi)}
        </div>
        `
           : ""
       }

    </div>

    ${
      showLatLong === false
        ? `
        <div>
            Latitude: ${latitude.toFixed(2)} |
            Longitude: ${longitude.toFixed(2)}
        </div>
        `
        : ""
    }

</div>
    ${
      showLatLong === false
        ? `<div>
            Latitude: ${latitude.toFixed(2)} |
            Longitude: ${longitude.toFixed(2)}
        </div>`
        : ""
    }

</div>
    </div>

    <div class="time">
        ${time.toLocaleString()}
    </div>
                `;

            earthquakeList.appendChild(earthquakeBox);
          }
        } catch (error) {
          console.error(error);

          earthquakeList.innerHTML = `
                <p>Unable to load earthquake information.</p>
            `;
        }
      }

      loadEarthquakes();
    </script>
  </body>
</html>
