<!DOCTYPE html>

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake List</title>

    <style>
        /* Top header */
        .top-frame {
            width: 100%;
            height: 100px;

            display: flex;
            align-items: center;

            position: relative;

            padding: 0 25px;

            box-sizing: border-box;

            background-color: #504f4f;
        }

        /* Logo */
        .Logo {
            position: relative;
            left: 0px;
            width: 70px;
            height: 70px;

            object-fit: contain;
        }

        /* SST MAPS name */
        .site-name {
            position: relative;
            margin-left: 15px;

            color: white;
        }

        .site-name h1 {
            position: relative;
            margin: 0;

            text-align: left;

            font-size: 30px;
        }

        .site-name p {
            position: relative;
            margin: 3px 0 0;

            color: #d0d0d0;

            font-size: 15px;
        }

        body {
            margin: 0;
            padding: 25px;
            background-color: #504f4f;
            font-family: Arial, sans-serif;
            color: #030303;
        }

        h1 {
            text-align: center;
        }

        #earthquake-list {
            width: min(900px, 100%);
            margin: 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .earthquake {
            display: grid;
            grid-template-columns: 100px 1fr 180px;
            align-items: center;
            padding: 18px;
            background-color: white;
            border: 1px solid #d0d0d0;
            border-left: 8px solid #777;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .magnitude {
            font-size: 28px;
            font-weight: bold;
        }

        .location {
            font-size: 19px;
            font-weight: bold;
        }

        .details {
            margin-top: 6px;
            color: #666;
        }

        .time {
            text-align: right;
            color: #555;
        }

        @media (max-width: 650px) {
            .top-frame {
                height: 80px;

                padding: 0 20px;
            }

            .Logo {
                left: 20px;
                width: 55px;
                height: 55px;
            }

            .site-name {
                left: 5px;
                margin-left: 10px;
            }

            .site-name h1 {
                left: 5px;
                font-size: 22px;
            }

            .site-name p {
                left: 5px;
                font-size: 12px;
            }

            .Version {
                top: 8px;
                right: 12px;

                font-size: 11px;
            }

            body {
                padding: 12px;
            }

            .earthquake {
                grid-template-columns: 75px 1fr;
            }

            .magnitude {
                font-size: 23px;
            }

            .location {
                font-size: 16px;
            }

            .time {
                grid-column: 2;
                text-align: left;
                margin-top: 8px;
                font-size: 13px;
            }

            .map-button,
            .settings-button {
                width: 30px;
                height: 30px;
            }

            .version {
                font-size: 12px;
            }



        }

        .map-button {

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 4px;
            background: rgb(48, 51, 54);
            padding: 0;
            cursor: pointer;
            z-index: 1000;
        }

        .map-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .list-settings-popup {
            display: none;

            position: fixed;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);

            width: 400px;
            height: 300px;

            padding: 30px;

            background: rgb(48, 51, 54);
            color: white;

            border: 2px solid #666;
            border-radius: 12px;

            z-index: 2000;

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .settings-button {
            width: 35px;
            height: 35px;

            border: none;
            background: transparent;
            border-radius: 4px;
            background: rgb(48, 51, 54);
            padding: 0;
            cursor: pointer;
            z-index: 1000;
        }

        .settings-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;

        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background-color: #777;
            border-radius: 28px;

            transition: 0.3s;
        }

        .slider::before {
            content: "";

            position: absolute;
            height: 22px;
            width: 22px;

            left: 3px;
            bottom: 3px;

            background-color: white;
            border-radius: 50%;

            transition: 0.3s;
        }

        input:checked+.slider {
            background-color: #2196f3;
        }

        input:checked+.slider::before {
            transform: translateX(22px);
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-text {
            margin: 0;
            font-size: 14px;
        }

        .today {
            color: white;
        }

        .top-controls {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 1000;
        }

        .left-buttons {
            display: flex;
            gap: 10px;
        }

        .version {
            color: white;
            font-size: 14px;
            margin: 0;
        }

        main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
    </style>


</head>

<body>

    <main>
        <div class="top-controls">

            <div class="left-buttons">

                <a href="index.html" class="map-button">
                    <img src="images/white_back_button.png" alt="back">
                </a>

                <button class="settings-button" onclick="openListSettingMenu()">
                    <img src="images/settings-button.png" alt="settings">
                </button>

            </div>

            <h2 id="version-text" class="version"></h2>

        </div>

        <div id="list-settings-popup" class="list-settings-popup">
            <h1 class=" select-date">Settings</h1>
            <br>
            <br>
            <div class="switch-container">

                <label class="switch">
                    <input type="checkbox" id="magnitude-toggle">>
                    <span class="slider"></span>
                </label>

                <h6 class="checkbox-text">Only Show 2.5 and Under</h6>

            </div>
            <br>
            <button onclick="submitMag()">Submit</button>
            <br>
            <br>
            <button onclick="closeListSettingMenu()">Close</button>

        </div>
    </main>
    <header class="top-frame">

        <img src="images/logo.PNG" alt="SST Maps Logo" class="Logo">

        <div class="site-name">
            <h1>SST MAPS</h1>
            <p>Earthquake Monitoring</p>
        </div>

    </header>


    <script src="script.js"></script>
    <script src="config.js"></script>

    <script>
        document.getElementById("version-text").textContent = `V-${WEB_VERSION}`
        function submitMag() {
            const toggle = document.getElementById("magnitude-toggle");

            if (toggle.checked) {
                minimumMagnitude = 2;
            } else {
                minimumMagnitude = 2.5;
            }

            closeListSettingMenu();
            loadEarthquakes();
        }
    </script>

    <h1 class="today">Earthquakes Today</h1>



    <div id="earthquake-list">
        Loading earthquakes...
    </div>

    <script src="config.js"></script>

    <script>
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");

        const end = new Date();
        const start = new Date(end.getTime() - 24 * 60 * 60 * 1000);
        let minimumMagnitude = 2.5

        async function loadEarthquakes() {
            const earthquakeList = document.getElementById("earthquake-list");

            try {
                const response = await fetch(
                    `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson` +
                    `&starttime=${start.toISOString()}` +
                    `&endtime=${end.toISOString()}` +
                    `&minmagnitude=${minimumMagnitude}` +
                    `&orderby=time` +
                    `&limit=20000`
                );

                const earthquakes = await response.json();

                earthquakeList.innerHTML = "";

                if (earthquakes.features.length === 0) {
                    earthquakeList.innerHTML = `
                    <p>No magnitude 2.0 or larger earthquakes were found today.</p>
                `;
                    return;
                }

                for (let i = 0; i < earthquakes.features.length; i++) {
                    const quake = earthquakes.features[i];

                    const longitude = quake.geometry.coordinates[0];
                    const latitude = quake.geometry.coordinates[1];
                    const depth = quake.geometry.coordinates[2];

                    const magnitude = quake.properties.mag;
                    const location = quake.properties.place;
                    const time = new Date(quake.properties.time);

                    const earthquakeBox = document.createElement("div");

                    let titleColor = "green";

                    if (quake.properties.mag >= 6) {
                        titleColor = "red"
                    } else if (quake.properties.mag >= 4 && quake.properties.mag < 5.9) {
                        titleColor = "orange"
                    }

                    earthquakeBox.className = "earthquake";

                    earthquakeBox.innerHTML = `
                    <div class="magnitude" style="margin:0; color:${titleColor};">
                        M ${magnitude.toFixed(1)}
                    </div>

                    <div>
                        <div class="location">
                            ${location}
                        </div>

                        <div class="details">
                            Depth: ${depth} km<br>
                            Latitude: ${latitude.toFixed(2)} |
                            Longitude: ${longitude.toFixed(2)}
                        </div>
                    </div>

                    <div class="time">
                        ${time.toLocaleString()}
                    </div>
                `;

                    earthquakeList.appendChild(earthquakeBox);
                }

            } catch (error) {
                console.error(error);

                earthquakeList.innerHTML = `
                <p>Unable to load earthquake information.</p>
            `;
            }
        }

        loadEarthquakes();
    </script>

</body>

</html>
