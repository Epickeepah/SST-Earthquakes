<!DOCTYPE html>

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake List</title>

    <style>
        /* Top header */
        .top-frame {
            width: 100%;
            height: 100px;

            display: flex;
            align-items: center;

            position: relative;

            padding: 0 25px;

            box-sizing: border-box;

            background-color: #504f4f;
        }

        /* Logo */
        .Logo {
            position: relative;
            left: 0px;
            width: 70px;
            height: 70px;

            object-fit: contain;
        }

        /* SST MAPS name */
        .site-name {
            position: relative;
            margin-left: 15px;

            color: white;
        }

        .site-name h1 {
            position: relative;
            margin: 0;

            text-align: left;

            font-size: 30px;
        }

        .site-name p {
            position: relative;
            margin: 3px 0 0;

            color: #d0d0d0;

            font-size: 15px;
        }

        body {
            margin: 0;
            padding: 25px;
            background-color: #504f4f;
            font-family: Arial, sans-serif;
            color: #030303;
        }

        h1 {
            text-align: center;
        }

        #earthquake-list {
            width: min(900px, 100%);
            margin: 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .earthquake {
            display: grid;
            grid-template-columns: 100px 1fr 180px;
            align-items: center;
            padding: 18px;
            background-color: white;
            border: 1px solid #d0d0d0;
            border-left: 8px solid #777;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .magnitude {
            font-size: 28px;
            font-weight: bold;
        }

        .location {
            font-size: 19px;
            font-weight: bold;
        }

        .details {
            margin-top: 6px;
            color: #666;
        }

        .time {
            text-align: right;
            color: #555;
        }

        @media (max-width: 650px) {
            .top-frame {
                height: 80px;

                padding: 0 15px;
            }

            .Logo {
                left: 20px;
                width: 55px;
                height: 55px;
            }

            .site-name {
                margin-left: 10px;
            }

            .site-name h1 {
                font-size: 22px;
            }

            .site-name p {
                font-size: 12px;
            }

            .Version {
                top: 8px;
                right: 12px;

                font-size: 11px;
            }

            body {
                padding: 12px;
            }

            .earthquake {
                grid-template-columns: 75px 1fr;
            }

            .magnitude {
                font-size: 23px;
            }

            .location {
                font-size: 16px;
            }

            .time {
                grid-column: 2;
                text-align: left;
                margin-top: 8px;
                font-size: 13px;
            }


        }

        .map-button {
            position: absolute;
            top: 8px;
            left: 10px;

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 4px;
            background: rgb(48, 51, 54);
            padding: 0;
            cursor: pointer;
            z-index: 1000;
        }

        .map-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>


</head>

<body>

    <main>
        <a href="index.html" class="map-button">
            <img src="images/white_back_button.png" alt="back">
        </a>
    </main>
    <header class="top-frame">

        <img src="images/logo.PNG" alt="SST Maps Logo" class="Logo">

        <div class="site-name">
            <h1>SST MAPS</h1>
            <p>Earthquake Monitoring</p>
        </div>

    </header>


    <script>
        // Your JavaScript stays here
    </script>

    <h1>Earthquakes Today</h1>



    <div id="earthquake-list">
        Loading earthquakes...
    </div>

    <script>
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");

        const end = new Date();
        const start = new Date(end.getTime() - 24 * 60 * 60 * 1000);

        async function loadEarthquakes() {
            const earthquakeList = document.getElementById("earthquake-list");

            try {
                const response = await fetch(
                    `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson` +
                    `&starttime=${start.toISOString()}` +
                    `&endtime=${end.toISOString()}` +
                    `&minmagnitude=2` +
                    `&orderby=time` +
                    `&limit=20000`
                );

                const earthquakes = await response.json();

                earthquakeList.innerHTML = "";

                if (earthquakes.features.length === 0) {
                    earthquakeList.innerHTML = `
                    <p>No magnitude 2.0 or larger earthquakes were found today.</p>
                `;
                    return;
                }

                for (let i = 0; i < earthquakes.features.length; i++) {
                    const quake = earthquakes.features[i];

                    const longitude = quake.geometry.coordinates[0];
                    const latitude = quake.geometry.coordinates[1];
                    const depth = quake.geometry.coordinates[2];

                    const magnitude = quake.properties.mag;
                    const location = quake.properties.place;
                    const time = new Date(quake.properties.time);

                    const earthquakeBox = document.createElement("div");

                    let titleColor = "green";

                    if (quake.properties.mag >= 6) {
                        titleColor = "red"
                    } else if (quake.properties.mag >= 4 && quake.properties.mag < 5.9) {
                        titleColor = "orange"
                    }

                    earthquakeBox.className = "earthquake";

                    earthquakeBox.innerHTML = `
                    <div class="magnitude" style="margin:0; color:${titleColor};">
                        M ${magnitude.toFixed(1)}
                    </div>

                    <div>
                        <div class="location">
                            ${location}
                        </div>

                        <div class="details">
                            Depth: ${depth} km<br>
                            Latitude: ${latitude.toFixed(2)} |
                            Longitude: ${longitude.toFixed(2)}
                        </div>
                    </div>

                    <div class="time">
                        ${time.toLocaleString()}
                    </div>
                `;

                    earthquakeList.appendChild(earthquakeBox);
                }

            } catch (error) {
                console.error(error);

                earthquakeList.innerHTML = `
                <p>Unable to load earthquake information.</p>
            `;
            }
        }

        loadEarthquakes();
    </script>

</body>

</html>
